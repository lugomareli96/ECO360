<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECO360 🌎🌱</title>
<style>
:root{--bg:#eaf6ec;--card:#fff;--tx:#1b2e20;--mut:#6a8a72;--g:#1f6e4e;--g2:#3f9d6f;--gL:#e7f2ea;--bd:#d6ecdb;--bgA:#f6fbf6;--bgB:#ddf0e2;
--sh:0 1px 2px rgba(10,50,30,.05),0 6px 18px rgba(10,50,30,.07);
--c-mision:#b8863a;--c-clasifica:#2f7f8f;--c-planta:#1f6e4e;--c-miplanta:#5c7a2e;--c-mascota:#a85a3f;--c-perfil:#3d5a80}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){--bg:#0f1f16;--card:#17281d;--tx:#e6f3e9;--mut:#8fb69b;--bd:#213b29;--gL:#152a1f;--sh:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.28);--bgA:#16281c;--bgB:#0b150f}}
:root[data-theme="dark"]{--bg:#0f1f16;--card:#17281d;--tx:#e6f3e9;--mut:#8fb69b;--bd:#213b29;--gL:#152a1f;--sh:0 1px 2px rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.28);--bgA:#16281c;--bgB:#0b150f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(90% 60% at 12% -6%,var(--bgA) 0%,var(--bg) 55%),radial-gradient(90% 60% at 100% 108%,var(--bgB) 0%,var(--bg) 55%);color:var(--tx);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;padding-bottom:80px;letter-spacing:.1px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:2rem;margin:.2em 0;letter-spacing:-.3px}
h2{font-size:1.08rem;margin:.5em 0;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:7px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--sh)}
button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:12px 16px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(31,110,78,.22)}
button.sec{background:transparent;color:var(--g);border:1.5px solid var(--g);box-shadow:none}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-space-around:space-around;padding:7px 2px;box-shadow:0 -4px 16px rgba(20,40,30,.06)}
nav button{background:none;color:var(--mut);font-size:.63rem;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;box-shadow:none;font-weight:600}
nav button span{font-size:1.15rem;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .15s}
nav button.on{color:var(--nc,var(--g))}
nav button.on span{background:var(--nc,var(--g));color:#fff}
.hero{background:radial-gradient(120% 140% at 15% 0%,#2c8a63,var(--g) 55%,#134430);color:#fff;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 10px 28px rgba(19,68,48,.28)}
.pill{display:inline-block;background:var(--gL);border:1px solid var(--bd);border-radius:999px;padding:4px 11px;font-size:.76rem;margin:2px 4px 2px 0;font-weight:600;color:var(--g)}
.bar{height:9px;background:var(--bd);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2))}
small,.mut{color:var(--mut)}
.sec-title{color:var(--sc,var(--g));font-size:1.25rem}
.pf-head{text-align:center;padding:22px 10px 14px}
.av-wrap{position:relative;display:inline-block;cursor:pointer}
.av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--g2);display:block;box-shadow:var(--sh)}
.av-ph{width:96px;height:96px;border-radius:50%;border:3px solid var(--g2);background:linear-gradient(135deg,var(--g),#2c8a63);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;box-shadow:var(--sh)}
.av-edit{position:absolute;right:-2px;bottom:0;background:var(--c-perfil);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;border:2px solid var(--bg)}
.badge-nivel{display:inline-block;margin-top:6px;background:var(--gL);border:1px solid var(--bd);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.85rem;color:var(--g)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stat span{font-size:1.4rem;display:block}
.stat b{display:block;font-size:1.1rem;margin:2px 0}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;text-align:center}
.soc{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0;box-shadow:none;font-weight:600}
.soc-g{background:#fff;color:#3c4043;border:1px solid var(--bd)}
.soc-f{background:#1877F2;color:#fff}
.or{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--mut);font-size:.8rem}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.ins{opacity:.4}
.ins.on{opacity:1}
.ins-ic{font-size:1.6rem;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 0;margin-bottom:4px}
.ins small{font-size:.68rem;display:block;line-height:1.2}
img.ph{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin:8px 0}
input,select{font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;margin:6px 0}
.hide{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--g);color:#fff;padding:10px 18px;border-radius:99px;z-index:9;font-weight:600}
.planta{font-size:4.5rem;text-align:center;margin:8px}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
</style>
</head>
<body>

<script>
const MIS=[

 {id:11,n:"🍃 Encuentra una planta con flores",d:"Fotografía una planta en floración de tu entorno.",lv:1,p:25},
 {id:12,n:"🥤 Detecta un plástico de un solo uso",d:"Registra un envase desechable y piensa cómo evitarlo.",lv:1,p:20},
 {id:13,n:"💧 Revisa una fuga de agua en casa o escuela",d:"Toma evidencia de una llave, manguera o tinaco.",lv:2,p:40},

 {id:15,n:"🐜 Observa un insecto en su hábitat",d:"Captura evidencia sin molestar al animal.",lv:2,p:45},
 {id:16,n:"♻️ Revisa los contenedores de tu escuela",d:"Documenta si la separación de residuos es correcta.",lv:3,p:65},
 {id:17,n:"🌱 Siembra una semilla",d:"Toma evidencia de tu siembra en maceta o suelo.",lv:3,p:75},

 {id:20,n:"⭐ Misión especial: EcoLíder",d:"Enseña a alguien más a separar residuos y toma evidencia.",lv:4,p:120}];
const ACC=[{v:"📷 Fotografía y describe",p:0},{v:"🔍 Investiga y documenta",p:10},{v:"✅ Revisa el estado de",p:5},{v:"🧹 Mejora o limpia",p:20},{v:"📝 Registra tres ejemplos de",p:15},{v:"🤝 Comparte con tu familia",p:25}];

 {n:"Lavanda",c:"Lavandula angustifolia",o:"Mediterráneo",t:"Aromática",tam:"60 cm",luz:"Sol pleno",ag:"Baja",su:"Drenante",tem:"15-28°C",cu:"Podar tras floración",be:"Atrae polinizadores",cur:"Su aroma repele mosquitos",cost:250,e:"💜"},
 {n:"Aloe vera",c:"Aloe barbadensis",o:"Península arábiga",t:"Suculenta",tam:"50 cm",luz:"Luz indirecta fuerte",ag:"Muy baja",su:"Arenoso",tem:"18-30°C",cu:"No encharcar",be:"Purifica el aire",cur:"Su gel es cicatrizante",cost:180,e:"🌵"},
 {n:"Nochebuena",c:"Euphorbia pulcherrima",o:"México",t:"Arbusto",tam:"1-3 m",luz:"Luz brillante",ag:"Media",su:"Rico en materia orgánica",tem:"16-24°C",cu:"Evitar corrientes frías",be:"Planta nativa mexicana",cur:"Los Aztecas la llamaban cuetlaxóchitl",cost:300,e:"🌺"},
 {n:"Menta",c:"Mentha spicata",o:"Europa y Asia",t:"Herbácea",tam:"40 cm",luz:"Media sombra",ag:"Alta",su:"Húmedo",tem:"15-25°C",cu:"Podar seguido",be:"Refugio de insectos benéficos",cur:"Se expande muy rápido",cost:150,e:"🌿"},
 {n:"Helecho",c:"Nephrolepis exaltata",o:"Zonas tropicales",t:"Helecho",tam:"70 cm",luz:"Sombra",ag:"Alta",su:"Húmedo y suelto",tem:"18-26°C",cu:"Rociar hojas",be:"Aumenta la humedad",cur:"Existen desde antes que los dinosaurios",cost:200,e:"🌱"}];

const ILUS={
"Lavanda":'<svg viewBox="0 0 120 120"><rect x="30" y="92" width="60" height="16" rx="4" fill="#a9744f"/><rect x="34" y="96" width="52" height="9" rx="3" fill="#8a5c3c"/><g stroke="#4c7a4f" stroke-width="3" fill="none"><path d="M60 96 L52 60"/><path d="M60 96 L60 55"/><path d="M60 96 L68 60"/><path d="M60 96 L44 68"/><path d="M60 96 L76 68"/></g><g fill="#8b6bc7"><ellipse cx="52" cy="55" rx="5" ry="12"/><ellipse cx="60" cy="48" rx="5" ry="14"/><ellipse cx="68" cy="55" rx="5" ry="12"/><ellipse cx="44" cy="63" rx="4" ry="10"/><ellipse cx="76" cy="63" rx="4" ry="10"/></g></svg>',
"Aloe vera":'<svg viewBox="0 0 120 120"><rect x="28" y="90" width="64" height="18" rx="5" fill="#c98a4b"/><rect x="32" y="94" width="56" height="10" rx="3" fill="#a86f38"/><g fill="#3f9d5c"><path d="M60 98 C55 70 50 45 46 20 C58 40 62 65 64 98 Z"/><path d="M60 98 C65 70 70 45 74 20 C62 40 58 65 56 98 Z"/><path d="M60 98 C48 75 38 55 28 35 C46 48 55 68 60 98 Z"/><path d="M60 98 C72 75 82 55 92 35 C74 48 65 68 60 98 Z"/></g></svg>',
"Nochebuena":'<svg viewBox="0 0 120 120"><rect x="34" y="92" width="52" height="16" rx="4" fill="#a9744f"/><rect x="38" y="96" width="44" height="9" rx="3" fill="#8a5c3c"/><g fill="#3f7d45"><ellipse cx="45" cy="70" rx="14" ry="9"/><ellipse cx="75" cy="70" rx="14" ry="9"/></g><g fill="#d63b3b"><path d="M60 92 L48 55 L60 65 L72 55 Z"/><path d="M60 92 L36 62 L52 68 L46 45 L60 60 Z"/><path d="M60 92 L84 62 L68 68 L74 45 L60 60 Z"/></g></svg>',
"Menta":'<svg viewBox="0 0 120 120"><rect x="32" y="92" width="56" height="16" rx="4" fill="#a9744f"/><rect x="36" y="96" width="48" height="9" rx="3" fill="#8a5c3c"/><g stroke="#3f7d45" stroke-width="3" fill="none"><path d="M60 96 L60 40"/></g><g fill="#4fae5f"><ellipse cx="46" cy="55" rx="11" ry="7" transform="rotate(-30 46 55)"/><ellipse cx="74" cy="55" rx="11" ry="7" transform="rotate(30 74 55)"/><ellipse cx="44" cy="75" rx="11" ry="7" transform="rotate(-25 44 75)"/><ellipse cx="76" cy="75" rx="11" ry="7" transform="rotate(25 76 75)"/><ellipse cx="60" cy="40" rx="9" ry="6"/></g></svg>',
"Helecho":'<svg viewBox="0 0 120 120"><rect x="30" y="94" width="60" height="14" rx="4" fill="#a9744f"/><rect x="34" y="98" width="52" height="8" rx="3" fill="#8a5c3c"/><g stroke="#2f7d45" stroke-width="2.5" fill="none"><path d="M60 96 C50 80 40 60 25 45"/><path d="M60 96 C55 75 50 55 45 30"/><path d="M60 96 C60 72 60 50 60 25"/><path d="M60 96 C65 75 70 55 75 30"/><path d="M60 96 C70 80 80 60 95 45"/></g><g fill="#3f9d5c"><ellipse cx="25" cy="45" rx="8" ry="4"/><ellipse cx="45" cy="30" rx="8" ry="4"/><ellipse cx="60" cy="25" rx="7" ry="4"/><ellipse cx="75" cy="30" rx="8" ry="4"/><ellipse cx="95" cy="45" rx="8" ry="4"/></g></svg>'};

const MA=[
 {n:"Mariposa",e:"🦋",h:"Jardines y praderas",a:"Néctar",i:"Poliniza flores silvestres",cur:"Prueba sabores con las patas",cost:400,pol:1,acc:["🌸 Espacio con flores","💧 Colocar agua","🌿 Mejorar hábitat","🦋 Ciclo de vida"]},
 {n:"Abeja",e:"🐝",h:"Colmenas y campos",a:"Néctar y polen",i:"Poliniza cultivos de alimentos",cur:"Bailan para dar direcciones",cost:450,pol:1,acc:["🌼 Sembrar flores","💧 Bebedero","🏠 Refugio","🍯 Aprender polinización"]},
 {n:"Colibrí",e:"🐦",h:"Bosques y jardines",a:"Néctar e insectos",i:"Poliniza plantas tubulares",cur:"Sus alas baten 80 veces por segundo",cost:500,pol:1,acc:["🌺 Flores rojas","💧 Bebedero","🌳 Árboles nativos","🐦 Aprender migración"]},
 {n:"Mariquita",e:"🐞",h:"Huertos y jardines",a:"Pulgones",i:"Control natural de plagas",cur:"Come hasta 50 pulgones al día",cost:350,pol:0,acc:["🌱 Plantas sin pesticida","💧 Humedad","🍃 Hojarasca","🐞 Aprender su ciclo"]},
 {n:"Tortuga",e:"🐢",h:"Estanques y humedales",a:"Plantas acuáticas e insectos",i:"Mantiene limpios los cuerpos de agua",cur:"Puede vivir más de 80 años",cost:550,pol:0,acc:["💧 Cuerpo de agua limpio","🌿 Vegetación acuática","☀️ Zona de sol","🐢 Aprender su hábitat"]}];

const CASITAS={"Mariposa":{n:"🏡 Jardín de mariposas",e:"🏡"},"Abeja":{n:"🏠 Hotel de abejas",e:"🏠"},"Colibrí":{n:"🍽️ Comedero-refugio",e:"🍽️"},"Mariquita":{n:"🌿 Refugio de hojarasca",e:"🌿"},"Tortuga":{n:"💧 Mini estanque",e:"💧"}};
const RES={Plástico:"Enjuaga, aplasta y separa la tapa. Va al contenedor de reciclables.",Papel:"Debe estar seco y sin grasa. Separa de residuos orgánicos.",Cartón:"Desarma y aplana las cajas antes de entregarlas.",Vidrio:"Enjuaga el envase; no mezcles vidrio roto con el resto.",Metal:"Enjuaga latas y aplástalas para reducir volumen.",Orgánico:"Puede ir a composta: restos de fruta, verdura y hojas.",Electrónico:"No va a la basura común. Llévalo a un centro de acopio RAEE.","No reciclable":"Va a residuos sanitarios o de disposición final. Intenta reducir su uso."};
const NIV=[[0,"Semilla 🌱"],[150,"Brote 🌿"],[350,"Guardián Verde 🌳"],[700,"EcoMaestro 🌎"]];
const CUID=[{n:"💧 Regar",c:20},{n:"☀️ Dar luz",c:30},{n:"🌱 Fertilizar",c:40},{n:"🪴 Cambiar maceta",c:50}];
const ETAPAS=["🌱 Semilla","🌿 Brote","🌷 Planta joven","🌳 Planta desarrollada"];
const INS=[{n:"♻️ Experto en reciclaje",f:s=>s.res.length>=20},{n:"🌿 Amigo de las plantas",f:s=>s.desc.length>=10},{n:"🌎 EcoExplorador",f:s=>s.hechas.length>=15},{n:"🐝 Guardián de la biodiversidad",f:s=>s.mascotas.length>=1&&s.desc.length>=3},{n:"🪴 Cuidador",f:s=>s.cuidados.length>=2},{n:"🏠 Arquitecto ecológico",f:s=>s.casitas.length>=1}];

let S,tab="inicio";
function def(n){return{nombre:n,foto:null,proveedor:null,puntos:0,hechas:[],desc:[],res:[],planta:null,crec:0,cuidados:[],mascotas:[],accMasc:[],casitas:[],ins:[],evid:[],hist:[],gen:null,plantasEscaneadas:[],fotosReales:{}}}
function save(){try{localStorage.setItem("eco360",JSON.stringify(S))}catch(e){}}
function load(){try{const d=localStorage.getItem("eco360");if(d){S=JSON.parse(d);if(!S.evid)S.evid=[];if(!S.plantasEscaneadas)S.plantasEscaneadas=[];if(!S.casitas)S.casitas=[];if(!S.fotosReales)S.fotosReales={};if(S.proveedor===undefined)S.proveedor=null;if(S.foto===undefined)S.foto=null;if(!S.hist)S.hist=S.hechas.map(i=>{const m=MIS.find(x=>x.id==i);return m?m.n:"EcoMisión"})}}catch(e){}}
function nivel(){let r=NIV[0][1];NIV.forEach(x=>{if(S.puntos>=x[0])r=x[1]});return r}
function mision(){const m=MIS.find(x=>!S.hechas.includes(x.id));if(m)return m;
 if(!S.gen||S.hechas.includes(S.gen.id))S.gen=generar();return S.gen}
function generar(){const libres=[];ACC.forEach((a,i)=>TEM.forEach((t,j)=>{if(!S.hechas.includes("g"+i+"-"+j))libres.push([i,j])}));
 if(!libres.length){S.hechas=S.hechas.filter(x=>typeof x=="number");return generar()}
 const p=libres[Math.floor(Math.random()*libres.length)],i=p[0],j=p[1],a=ACC[i];
 const lv=Math.min(3,1+Math.floor(S.hechas.length/8)),esp=S.hechas.length%7==0;
 return{id:"g"+i+"-"+j,n:(esp?"⭐ ":"")+a.v+" "+TEM[j],d:"Toma evidencia en vivo de "+TEM[j]+".",lv:esp?4:lv,p:(esp?100:20+lv*15)+a.p}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function gana(p,txt){S.puntos+=p;toast("+"+p+" EcoPuntos 🌱"+(txt?" · "+txt:""));chkIns();save()}
function chkIns(){INS.forEach(i=>{if(!S.ins.includes(i.n)&&i.f(S)){S.ins.push(i.n);setTimeout(()=>toast("🏅 Insignia: "+i.n),900)}})}
function go(t){tab=t;render()}
const H=s=>s.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function render(){
 const a=document.getElementById("app"),nv=document.getElementById("nav");
 if(!S){nv.classList.add("hide");a.innerHTML=`<div class="hero"><h1>🌎 ECO360</h1><p>“Aprende, cuida y haz crecer tu mundo.”</p></div>

async function procesarFotoPlanta(input){
 const f=input.files[0];if(!f)return;
 const im=document.getElementById("fp");im.src=URL.createObjectURL(f);im.classList.remove("hide");
 const est=document.getElementById("iaEstado");
 est.textContent="🌍 Conectando con el servidor de Pl@ntNet para identificación científica...";
 document.getElementById("ficha").innerHTML="";

 // Coloca aquí tu clave personal obtenida en my.plantnet.org
 const API_KEY = "2b10f7kf9lGojLa4H1ZsZiswO"; 

 const formData = new FormData();
 formData.append("images", f);
 formData.append("organs", "auto");

 try {
   const res = await fetch(`https://my-api.plantnet.org/v2/identify/all?api-key=${API_KEY}&lang=es`, {
     method: "POST",
     body: formData
   });
   
   if(!res.ok) {
     const errorData = await res.json().catch(() => ({}));
     throw new Error(errorData.message || `Error ${res.status}: Clave API no válida o límite excedido`);
   }
   
   const data = await res.json();
   if (data.results && data.results.length > 0) {
     const top = data.results[0];
     const nombreCientifico = top.species?.scientificNameWithoutAuthor || top.species?.scientificName || "Especie no identificada";
     const nombreComun = (top.species?.commonNames && top.species.commonNames.length > 0) 
       ? top.species.commonNames[0] 
       : nombreCientifico;
     const confianza = Math.round((top.score || 0) * 100);

     est.textContent = `✅ ¡Identificada con ${confianza}% de precisión científica!`;

     const r=new FileReader();
     r.onload=()=>{
       const img=new Image();img.onload=()=>{
         const c=document.createElement("canvas"),sz=260,s=Math.max(sz/img.width,sz/img.height);
         c.width=sz;c.height=sz;const ctx=c.getContext("2d"),w=img.width*s,h=img.height*s;
         ctx.drawImage(img,(sz-w)/2,(sz-h)/2,w,h);
         const dataUrl = c.toDataURL("image/jpeg",.8);
         
         const nuevaPlanta = {
           n: nombreComun.charAt(0).toUpperCase() + nombreComun.slice(1),
           c: nombreCientifico,
           o: "Global / Silvestre",
           t: "Planta identificada",
           tam: "Variable",
           luz: "Luz solar recomendada",
           ag: "Moderada",
           su: "Suelo fértil",
           tem: "Adaptable",
           cu: "Consultar guía botánica según especie",
           be: "Aporta al ecosistema local",
           cur: `Especie registrada científicamente con ${confianza}% de certeza.`,
           cost: 200,
           e: "🌿",
           foto: dataUrl
         };

         if(!S.plantasEscaneadas) S.plantasEscaneadas = [];
         if(!S.plantasEscaneadas.find(p => p.c === nombreCientifico)){
           S.plantasEscaneadas.push(nuevaPlanta);
         }

         if(!S.fotosReales) S.fotosReales={};
         S.fotosReales[nuevaPlanta.n] = dataUrl;
         save();

         mostrarFicha(nuevaPlanta, true);
         document.getElementById("ficha").insertAdjacentHTML("beforeend",
           `<button style="width:100%;margin-top:12px" onclick="go('miplanta')">🌸 Ir a Mi Planta para cuidarla</button>`
         );
       };
       img.src=r.result;
     };
     r.readAsDataURL(f);

   } else {
     est.textContent = "❓ No se encontró una coincidencia clara. Intenta tomar una foto más cercana a la hoja o flor.";
   }
 } catch (err) {
   console.error(err);
   est.textContent = "❌ " + err.message;
 }
}
